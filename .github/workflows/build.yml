name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/autoforge/app
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "Antares"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.autoforge.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.antares.app'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Antares" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/autoforge/app/MainActivity.java <<'EOF'
          package com.autoforge.app;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          public class MainActivity extends Activity {
            private WebView webView;
            public static class Bridge {
              private final Activity a;
              Bridge(Activity a) { this.a = a; }
              @JavascriptInterface
              public void save(String name, String content) {
                String msg;
                try {
                  OutputStream os;
                  if (Build.VERSION.SDK_INT >= 29) {
                    ContentValues v = new ContentValues();
                    v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                    v.put(MediaStore.Downloads.MIME_TYPE, "text/html");
                    v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                    Uri u = a.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                    os = a.getContentResolver().openOutputStream(u);
                  } else {
                    os = new FileOutputStream(new File(a.getExternalFilesDir(null), name));
                  }
                  os.write(content.getBytes("UTF-8"));
                  os.close();
                  msg = "Saved: " + name;
                } catch (Exception e) {
                  msg = "Save failed: " + e.getMessage();
                }
                final String m = msg;
                a.runOnUiThread(() -> Toast.makeText(a, m, Toast.LENGTH_LONG).show());
              }
            }
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              webView = new WebView(this);
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              webView.addJavascriptInterface(new Bridge(this), "AndroidBridge");
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("file:///android_asset/index.html");
            }
            @Override
            public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack(); else super.onBackPressed();
            }
          }
          EOF
      - name: Add app icon
        run: |
          if [ -f icon.png ]; then
            mkdir -p app/src/main/res/drawable
            cp icon.png app/src/main/res/drawable/ic_launcher.png
            sed -i 's/<application /<application android:icon="@drawable\/ic_launcher" /' app/src/main/AndroidManifest.xml
          fi
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Antares-APK
          path: app/build/outputs/apk/debug/app-debug.apk
